# nginx site config for crm.landcaller.com
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/.
#
# TLS is provisioned by certbot (see docs/DEPLOY.md); the managed lines below are
# written by `certbot --nginx` on first run.

server {
    listen 80;
    listen [::]:80;
    server_name crm.landcaller.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.landcaller.com;

    ssl_certificate     /etc/letsencrypt/live/crm.landcaller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.landcaller.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSV imports of skip-traced owner lists get large; the default 1m is too small.
    client_max_body_size 25m;

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bulk sends and imports can outlast the 60s default.
        proxy_read_timeout 120s;
    }

    # ── Web ─────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Next.js dev/HMR websockets and future live dialer updates.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js fingerprints these filenames, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
